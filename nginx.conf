# ──────────────────────────────────────────────────────────────
# Nginx Configuration for React SPA
# - Serves static files from the Vite build output
# - Proxies /api/ requests to the Django backend
# - Proxies /ws/ WebSocket connections to the Django backend
# - Falls back to index.html for React Router (SPA routing)
# ──────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── Static asset caching ─────────────────────────────────
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Proxy API requests to Django backend ─────────────────
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy WebSocket connections to Django Channels ───────
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Proxy Django admin static files ──────────────────────
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # ── SPA fallback — React Router handles all other routes ─
    location / {
        try_files $uri $uri/ /index.html;
    }
}
