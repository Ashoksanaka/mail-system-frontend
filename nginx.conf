# ──────────────────────────────────────────────────────────────
# Nginx Configuration for React SPA
# - Serves static files from the Vite build output
# - Proxies /api/ requests to the Django backend
# - Proxies /ws/ WebSocket connections to the Django backend
# - Falls back to index.html for React Router (SPA routing)
#
# Public reverse-proxy locations intentionally omit `internal`
# (browsers must reach /api and /ws). Upstream host is fixed via
# $backend — not client-controlled — so this is not an open proxy.
# ──────────────────────────────────────────────────────────────

server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    # Docker embedded DNS — resolve upstream at request time so nginx
    # can start even when the backend container is not yet running.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    # ── Static asset caching ─────────────────────────────────
    location ~* \.(js|css|png|jpg|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Proxy API requests to Django backend ─────────────────
    location /api/ {
        proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not forward Upgrade on non-WS locations
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    # ── Proxy WebSocket connections to Django Channels ───────
    location /ws/ {
        # Reject non-WebSocket upgrades (h2c / arbitrary Upgrade)
        if ($http_upgrade !~* ^websocket$) {
            return 426;
        }

        proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        # Hardcoded websocket upgrade after whitelist check above.
        # Semgrep still matches this pattern even with the mitigation; see
        # https://github.com/semgrep/semgrep-rules/issues/3768
        proxy_http_version 1.1; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade websocket; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Connection upgrade; # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # ── Proxy Django admin ───────────────────────────────────
    location /admin/ {
        proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    location /static/ {
        proxy_pass $backend; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_set_header Host $proxy_host;
        proxy_set_header Upgrade "";
        proxy_set_header Connection "";
    }

    # ── SPA fallback — React Router handles all other routes ─
    location / {
        try_files $uri $uri/ /index.html;
    }
}
