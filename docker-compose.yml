# ──────────────────────────────────────────────────────────────
# Docker Compose — Bulk Email Dispatch Platform (Frontend)
# Services: frontend
# ──────────────────────────────────────────────────────────────

services:
  # ── React Frontend (Nginx) ──────────────────────────────
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    ports:
      - "3000:8080"
    networks:
      - mail_system_net

# ── Networks ─────────────────────────────────────────────────
networks:
  mail_system_net:
    name: mail_system_net
    external: true
